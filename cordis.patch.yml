# dsh-memory bundle for DeepSeek Harness (dsh).
# Two rows:
#   memory-hub   — host plane: the shared MemoryService singleton + the
#                  `memory` storage domain + the panel API routes. P2 fusion
#                  recall (score × n-gram semantic × entity-graph) and the
#                  archive/graph service live here (semanticWeight, graphWeight,
#                  archiveThreshold).
#   memory-agent — agent plane: model-facing tools, dynamic-context recall,
#                  turn/end refresh, P1 LLM auto-extraction and P2 background
#                  maintenance (archiveBelow / reflect / consolidate, all
#                  cadence-configurable; 0 disables). P0 mounts it globally;
#                  a later phase moves it behind agent presets.
- insert:
    - id: memory-hub
      name: 'dsh-memory'

    - id: memory-agent
      name: 'dsh-memory/agent'
