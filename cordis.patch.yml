# dsh-memory bundle for DeepSeek Harness (dsh).
# Two rows:
#   memory-hub   — host plane: the shared MemoryService singleton + the
#                  `memory` storage domain + the panel API routes.
#   memory-agent — agent plane: model-facing tools, dynamic-context recall,
#                  turn/end refresh, and P1 LLM auto-extraction (config:
#                  extraction.{enabled,everyNTurns,...}, optional provider+model
#                  override; the default reuses the session's request/header
#                  route). P0 mounts it globally; a later phase moves it behind
#                  agent presets.
- insert:
    - id: memory-hub
      name: 'dsh-memory'

    - id: memory-agent
      name: 'dsh-memory/agent'
